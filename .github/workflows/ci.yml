name: ci

on:
  push:
    branches: [main]
  pull_request:

# Windows runner 的 stdout 默认是 cp1252，这个项目的输出全是中文，
# 不强制 UTF-8 的话第一个中文断言消息就会把真正的失败信息盖掉。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check src tests tools examples

      - name: Compile check
        # -W 是解释器参数，必须放在 -m 之前；放到 compileall 后面会被它自己解析。
        run: python -W error::SyntaxWarning -m compileall -q src tools examples

      - name: Tests
        run: pytest -q

      - name: Usability check
        run: python tools/user_check.py

  mutation:
    name: mutation / ubuntu / py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mutation testing
        run: python tools/mutate.py
